# Infraestrutura local de desenvolvimento: PostgreSQL e Redis.
# Sobe com `docker compose up -d`. Os valores batem com .env.example.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rids
      POSTGRES_PASSWORD: rids
      POSTGRES_DB: rids
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rids -d rids"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
